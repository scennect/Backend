    function addNewProject() {
        const name = document.getElementById('newProjectName').value;
        let emails = document.getElementById('memberEmails').value.split(',').map(email => email.trim());
        const isPublic = document.getElementById('isPublic').checked;

        // 입력값 유효성 검사
        if (!name) {
            alert("Project name is required.");
            return;
        }
        if (emails.length === 0 || emails[0] === "") {
            // alert("At least one email is required.");
            emails = null;
        }

        const newProjectData = {
            name: name,
            isPublic: isPublic,
            memberEmails: emails
        };
        console.log(newProjectData);

        fetch(`/project`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                // 인증이 필요하면 아래 라인을 복구하세요
                "access": `${localStorage.getItem('access')}` // Access Token 추가
            },
            body: JSON.stringify(newProjectData)
        })
            .then(response => response.json())
            .then(data => {
                if (data.isSuccess) {
                    console.log("Project created:", data.message);
                    loadProjectList();
                    document.getElementById('nav-showList-tab').click(); // UI 업데이트 코드
                } else {
                    throw new Error(data.message || 'Project creation failed');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert(`Project creation failed: ${error.message}`);
            });
    }

    document.getElementById("login-form").addEventListener("submit", function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        const loginData = {
            username: username,
            password: password,
        };

        fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify(loginData),
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Login failed');
                }

                // Extract the access token from response headers
                const accessToken = response.headers.get('access');
                console.log("Access Token from headers:", accessToken);

                // Store the access token in localStorage
                if (accessToken) {
                    localStorage.setItem("access", accessToken);
                } else {
                    throw new Error('Access token not found in response headers');
                }

                return response.json();  // Assuming the server sends a JSON response
            })
            .then(data => {
                console.log("Server Response:", data); // Log the full response for debugging

                // Redirect to index.html
                // window.location.href = "index.html";
                document.getElementById('btn-offcanvas-sign').click();
                projectListStateControl();
                
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Login failed");
            });
    });


    document.getElementById("signup-form").addEventListener("submit", async function (event) {
        event.preventDefault();

        // Gather form data
        const username = document.getElementById("signUp-username").value;
        const password = document.getElementById("signUp-password").value;
        const name = document.getElementById("signUp-name").value;
        const email = document.getElementById("signUp-eMail").value;

        try {
            // Step 1: Check if the username is available using the /check-id endpoint
            const checkIdResponse = await fetch(`/check-id?username=${encodeURIComponent(username)}`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            });

            const checkIdResult = await checkIdResponse.json();

            if(!checkIdResponse.ok || !checkIdResult.isSuccess){
                console.error("Username check failed:", checkIdResponse.ok, checkIdResult.isSuccess);
                return;
                if (!checkIdResult.data) {
                    alert("Username is already taken. Please choose another one.");
                    return;
                }
            }

            // Step 2: Proceed with signup if username is available
            const signUpData = {
                username: username,
                password: password,
                name: name,
                email: email
            };

            try {
                const response = await fetch("/join", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(signUpData)
                });

                const result = await response.json();

                if (response.ok && result.isSuccess) {
                    alert("Signup successful!");
                    console.log(result.message); // Success message

                    // Optional: Trigger any additional action on signup success
                    // document.getElementById('btn-offcanvas-sign').click();
                } else {
                    alert("Signup failed: " + result.message);
                    console.error("Error code:", result.code);
                }
            } catch (error) {
                console.error("Signup request failed:", error);
                alert("An error occurred during signup. Please try again.");
            }
        } catch (error) {
            console.error("Username check request failed:", error);
            alert("An error occurred while checking the username. Please try again.");
        }
    });

    // BackGround Dragging
    const background = document.getElementById('background');
    let isDragging = false;
    let startX, startY, scrollLeft, scrollTop;

    background.addEventListener('mousedown', (e) => {
        isDragging = true;
        background.style.cursor = 'grabbing';
        startX = e.pageX - background.offsetLeft;
        startY = e.pageY - background.offsetTop;
        scrollLeft = window.scrollX;
        scrollTop = window.scrollY;
    });

    background.addEventListener('mouseleave', () => {
        isDragging = false;
        background.style.cursor = 'grab';
    });

    background.addEventListener('mouseup', () => {
        isDragging = false;
        background.style.cursor = 'grab';
    });

    background.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.pageX - startX;
        const y = e.pageY - startY;
        window.scrollTo(scrollLeft - x, scrollTop - y);
    });

    function connectButtons(node) {
        //console.log(node, node.children);
        var btn1;
        var btn2;
        const svgCont = document.getElementsByClassName('svg-container')[0];
        
        if(node.children == null){
            return;
        }

        for (let i = 0; i < node.children.length; i++) {
            //console.log("parents abled");
            btn1 = document.querySelector(`#node-${node.id} .img2img`);

            if(node.children[i] != null){
                //console.log("child abled");
                // console.log(node.children[i], node.children[i].id);
                //console.log(`#node-${node.children[i].id}`, document.querySelector(`#node-${node.children[i].id} .img2img`));
                const svgNS = "http://www.w3.org/2000/svg";
                var path = document.createElementNS(svgNS, 'path');
                
                path.id = `path-${node.children[i].id}`;
                path.classList.add('animated-dash');

                btn2 = document.querySelector(`#node-${node.children[i].id} .img2img`);

                const pos1 = btn1.getBoundingClientRect();
                const pos2 = btn2.getBoundingClientRect();

                // 부모 버튼의 중심 좌표
                // const x1 = pos1.left + pos1.width / 2;
                const x1 = (pos1.right - 16);
                const y1 = (pos1.top + pos1.height / 2);

                // 자식 버튼의 중심 좌표
                // const x2 = pos2.left + pos2.width / 2;
                const x2 = (pos2.left + 16);
                const y2 = (pos2.top + pos2.height / 2);

                // 중간 좌표 - 직각으로 꺾이는 지점 설정
                const midX = (x1 + x2) / 2;  // x축 중간 지점
                const midY1 = y1;            // 부모의 y축
                const midY2 = y2;            // 자식의 y축

                // Path 경로를 설정: M(x1, y1) -> L(midX, midY1) -> L(midX, midY2) -> L(x2, y2)
                // const pathData = `M${x1},${y1} L${midX},${midY1} Q${midX},${(midY1 + midY2) / 2},${midX},${midY2} L${x2},${y2}`;
                const pathData = `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`;

                // Path에 경로 설정
                path.setAttribute('d', pathData);
                path.setAttribute('stroke', 'black');
                path.setAttribute('stroke-width', '2');
                path.setAttribute('fill', 'none');

                // SVG에 Path 추가
                svgCont.appendChild(path);

                connectButtons(node.children[i]);
            }
        }
    }

    function findNodeById(nodes, targetId) {
        // 각 노드를 순회하며 검사
        for (const node of nodes) {
            // 현재 노드의 id가 목표 id와 일치하면 반환
            if (node.id === targetId) {
                return node;
            }
            // 현재 노드에 children이 있으면 재귀적으로 검사
            if (node.children && node.children.length > 0) {
                const foundNode = findNodeById(node.children, targetId);
                if (foundNode) {
                    return foundNode; // 찾으면 바로 반환
                }
            }
        }
        return null; // 찾지 못한 경우 null 반환
    }

    // 두 버튼 사이에 선을 그리는(업데이트) 함수
    function drawLine(btn1, btn2, target){
        const pos1 = btn1.getBoundingClientRect();
        const pos2 = btn2.getBoundingClientRect();

        // 부모 버튼의 중심 좌표
        const x1 = (pos1.right - 16);
        const y1 = (pos1.top + pos1.height / 2);

        // 자식 버튼의 중심 좌표
        const x2 = (pos2.left + 16);
        const y2 = (pos2.top + pos2.height / 2);

        // 중간 좌표 - 직각으로 꺾이는 지점 설정
        const midX = (x1 + x2) / 2;  // x축 중간 지점
        const midY1 = y1;            // 부모의 y축
        const midY2 = y2;            // 자식의 y축

        // Path 경로를 설정: M(x1, y1) -> L(midX, midY1) -> L(midX, midY2) -> L(x2, y2)
        const pathData = `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`;

        // Path에 경로 설정
        if(target == null){
            var path = document.createElementNS("http://www.w3.org/2000/svg", 'path');
            //path.id = `path-${node.children[i].id}`;
            path.classList.add('animated-dash');
            path.classList.add('tempPath');
            path.classList.add('childPathOf-' + btn1.parentElement.parentElement.parentElement.id.replace("node-", ""));

            path.setAttribute('d', pathData);
            path.setAttribute('stroke', 'black');
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');

            // SVG에 Path 추가
            const svgCont = document.getElementsByClassName('svg-container')[0];
            svgCont.appendChild(path);

        }else{
            var path = target;
        }
        path.setAttribute('d', pathData);
    }

    // 드래그 시 라인 변화 반영
    function updateLine(nodeElement){

        // 부모자식 수정시 nodeCheck 업데이트 필요
        const currentId = parseInt(nodeElement.id.replace("node-", ""));

        const currentNode = findNodeById(nodeCheck.nodes, currentId);

        const childPathes = document.getElementsByClassName('childPathOf-' + currentId);
        
        
        

        if(currentNode?.children != undefined){ // 부모인 경우 == 자식 노드가 있을 경우
            // console.log("case1");
            const childNodeElement = currentNode.children;
            const btn1 = nodeElement.querySelector(`.img2img`);

            for (let i = 0; i < childNodeElement.length; i++) {
                let btn2 = document.querySelector(`#node-${childNodeElement[i].id} .img2img`);
                drawLine(btn1, btn2, document.querySelector(`#path-${childNodeElement[i].id}`));
            }
        }
        if(currentNode?.parentNodeId != undefined){ // 자식인 경우 == 부모 노드가 있을 경우
            // console.log("case2");
            // console.log(currentNode, currentNode.parentNodeId, document.querySelector(`#node-${currentNode.parentNodeId}`));

            let btn1 = document.querySelector(`#node-${currentNode.parentNodeId} .img2img`); // 부모
            let btn2 = nodeElement.querySelector(`.img2img`); // 나
            drawLine(btn1, btn2, document.querySelector(`#path-${currentNode.id}`));
        }
        if(childPathes?.length != 0){ // 부모자식둘다 여부 상관없이 img2img는 존재 가능하므로
            // console.log("case3");
            const ImgNodeChildOf = document.getElementsByClassName('ImgNode-ChildOf-' + currentId);
            for (let i = 0; i < childPathes.length; i++) {
                drawLine(document.querySelector(`#node-${currentId} .img2img`), ImgNodeChildOf[i].getElementsByClassName("generateBtn")[0], childPathes[i]);
            } 
        }
        if(nodeElement.classList.contains("before")){ // 이미지 생성중 노드인 경우
            // console.log("case4"); // 두개이상 처리 필요
            const matchingClasses = Array.from(nodeElement.classList).filter(cls => cls.startsWith('ImgNode-ChildOf-'))[0].replace("ImgNode-ChildOf-", "");

            // console.log("case4", matchingClasses, matchingClasses.replace("ImgNode-ChildOf-", ""), document.querySelector(`#node-${matchingClasses} .img2img`), );
            
            drawLine(document.querySelector(`#node-${matchingClasses} .img2img`), nodeElement.querySelector(`.generateBtn`), document.querySelector(`.childPathOf-${matchingClasses}`));
            
        }
    }

    // WebSocket 연결 함수
    function connectWebSocket(projectId) {
        const socket = new SockJS('/ws'); // 서버의 WebSocket 엔드포인트
        stompClient = Stomp.over(socket);

        stompClient.connect({
            "access": `${localStorage.getItem('access')}` // Access Token 추가
        }, function (frame) {
            console.log('Connected: ' + frame);

            // WebSocket을 통해 노드 정보 실시간으로 받는 구독 설정
            stompClient.subscribe(`/topic/project/${projectId}`, function (message) {
                
                console.log("ws : addNodeToList");
                
                const newNode = JSON.parse(message.body);
                addNodeToList(newNode);
                upadteNodeCheck();
            });

            // WebSocket을 통해 들어온 노드 좌표 데이터를 처리
            stompClient.subscribe(`/topic/node/${projectId}`, function (message) {
                const nodeData = JSON.parse(message.body);

                // 전송된 nodeId로 해당 노드 요소를 찾음
                const nodeElement = document.getElementById(`node-${nodeData.nodeId}`);

                if (nodeElement) {
                    // 노드의 위치를 새로운 좌표로 업데이트
                    nodeElement.style.left = `${nodeData.x}px`;
                    nodeElement.style.top = `${nodeData.y}px`;

                    // 선 업데이트
                    updateLine(nodeElement);
                } else {
                    console.error(`Node with ID ${nodeData.nodeId} not found.`);
                }
            });

            // WebSocket을 통해 마우스 좌표 수신
            stompClient.subscribe(`/topic/mouse/${projectId}`, function (message) {
                const mouseData = JSON.parse(message.body);

                if (mouseData.type === "disconnect") {
                    const { name } = mouseData; // mouseData에서 name 가져오기
                    if (userCursors[name]) {
                        userCursors[name].remove(); // DOM 요소 삭제
                        delete userCursors[name]; // userCursors에서 제거
                    }
                }
                else{
                    const { name, x, y } = mouseData;

                    // 커서 요소가 이미 존재하는지 확인
                    if (!userCursors[name]) {
                        // 커서 요소 생성
                        const cursorElement = document.createElement('div');
                        cursorElement.className = 'cursor';
                        cursorElement.style.position = 'absolute';
                        cursorElement.innerHTML = `<span>${name}</span>`;
                        document.body.appendChild(cursorElement);

                        // 사용자 커서 저장
                        userCursors[name] = cursorElement;
                    }

                    // 커서 위치 업데이트
                    const cursorElement = userCursors[name];
                    cursorElement.style.left = `${x}px`;
                    cursorElement.style.top = `${y}px`;
                }
            });

            // 노드 삭제 이벤트 구독
            stompClient.subscribe(`/topic/delete/${projectId}`, function (message) {
                const nodeID = message.body; // 서버로부터 삭제된 nodeID를 받음
                console.log("ws : delete node:", nodeID);

                // 로컬에서 이미 삭제한 노드라면 생략
                if (locallyDeletedNodes.has(nodeID)) {
                    console.log("Skipping deleteNode: already deleted locally");
                    locallyDeletedNodes.delete(nodeID); // 로컬 기록에서 제거
                    return;
                }

                if(document.getElementById(`node-${nodeID}`)){
                    document.getElementById(`node-${nodeID}`)?.remove();
                    document.getElementById(`path-${nodeID}`)?.remove();
                    upadteNodeCheck();
                    console.log("Node deleted successfully.");
                }
            });

        });
    }

    //드래그 가능한 기능을 추가하는 함수 - nodeForm에 대해 적용되어있음
    function makeDraggable(element) {
        let offsetX, offsetY;

        element.addEventListener('mousedown', function(event) {
            offsetX = event.clientX - element.getBoundingClientRect().left;
            offsetY = event.clientY - element.getBoundingClientRect().top;

            document.addEventListener('mousemove', dragElement);
            document.addEventListener('mouseup', stopDrag);
        });

        function dragElement(event) {
            element.style.left = `${event.clientX - offsetX}px`;
            element.style.top = `${event.clientY - offsetY}px`;

            if(element.classList.contains("node-box")){
                updateLine(element);
            }
        }

        function stopDrag() {
            document.removeEventListener('mousemove', dragElement);
            document.removeEventListener('mouseup', stopDrag);
        }
    }

    


    function makeNodeDraggable(nodeElement, nodeId) {
        let offsetX, offsetY;

        // 드래그 시작 시 처리
        nodeElement.addEventListener('mousedown', function(event) {
            offsetX = event.clientX - nodeElement.getBoundingClientRect().left; // 마우스 X 위치
            offsetY = event.clientY - nodeElement.getBoundingClientRect().top; // 마우스 Y 위치

            //console.log("dragEvent");
            // 드래그 중에 노란색 테두리 적용
            nodeElement.style.border = '2px solid yellow'; // 노란색 테두리로 변경

            // 문서에 마우스 이동 이벤트 리스너 추가
            document.addEventListener('mousemove', dragNode);
            

            // 마우스 버튼이 떼어지면 드래그 종료
            document.addEventListener('mouseup', stopDrag);
            updateLine(nodeElement);
        });

        // 노드 드래그 함수
        function dragNode(event) {
            updateLine(nodeElement);
            nodeElement.style.left = `${event.clientX - offsetX}px`; // 새로운 X 위치 설정
            nodeElement.style.top = `${event.clientY - offsetY}px`; // 새로운 Y 위치 설정
            
            
            // 노드 이동 정보를 다른 사용자에게 전송하는 로직 추가 가능
            const nodeData = {
                nodeId: nodeId,
                x: parseInt(nodeElement.style.left, 10),
                y: parseInt(nodeElement.style.top, 10)
            };

            // WebSocket을 통해 다른 사용자에게 노드의 새로운 위치 전송
            stompClient.send(`/app/node/${CurrentProjectId}`, {}, JSON.stringify(nodeData));
            console.log("dragNode");
        }

        // 드래그 종료 함수
        function stopDrag() {
            // 드래그 종료 시 테두리 원래 색으로 되돌리기
            nodeElement.style.border = '2px solid black'; // 원래의 테두리 색으로 복원

            // 현재 노드 좌표를 서버로 전송하여 데이터베이스에 저장
            const nodeData = {
                x: parseInt(nodeElement.style.left, 10),
                y: parseInt(nodeElement.style.top, 10)
            };

            // 서버로 PATCH 요청을 보내 좌표 업데이트 (데이터베이스에 반영)
            fetch(`/node/${nodeId}`, {
                method: 'PATCH',
                headers: {
                    "Content-Type": "application/json",
                    "access": `${localStorage.getItem('access')}` // Access Token 추가
                },
                body: JSON.stringify(nodeData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to update node coordinates in database');
                    }
                    return response.json();
                })
                .then(data => {
                    //updateLine(nodeElement);
                    console.log("Node coordinates updated:", data);
                })
                .catch(error => {
                    console.error("Error updating node coordinates:", error);
                });
                
            
            console.log("stopDrag");
            // 이벤트 리스너 제거
            document.removeEventListener('mousemove', dragNode);
            document.removeEventListener('mouseup', stopDrag);

            //updateLine(nodeElement);
            // nodeElement.click();
        }
    }

            // 요청 중 표시
            console.log("Sending request to create node...");
            showLoadingIndicator(); // 로딩 표시 함수 호출 (UI에서 스피너 활성화)

            // 서버로 노드 생성 요청
            const response = await fetch('/node', {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "access": `${localStorage.getItem('access')}` // Access Token 추가
                },
                body: JSON.stringify(nodeData)
            });

            if (!response.ok) {
                throw new Error('Network response was not ok ' + response.statusText);
            }

            const data = await response.json();

            // 요청 성공 후 처리
            console.log("Node created:", data);
            addNodeToList(data); // 새로 생성된 노드를 화면에 추가
            hideLoadingIndicator(); // 로딩 표시 숨김
            prompt.value = ''; // 입력 필드 초기화

            onSuccess(); // 성공 후 추가 작업 (예: 알림 표시)
        } catch (error) {
            // 에러 처리
            console.error("Error creating node:", error);
            hideLoadingIndicator(); // 로딩 표시 숨김
            onError(error); // 에러 발생 시 추가 작업 (예: 알림 표시)
        }
    });
    ////////////////////////////////////////////
        function showLoadingIndicator() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            if (loadingIndicator) {
                loadingIndicator.style.display = 'flex';
            }
        }
        function hideLoadingIndicator() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            if (loadingIndicator) {
                loadingIndicator.style.display = 'none';
            }
        }
        function onSuccess() {
            console.log("Node creation succeeded!");
            // 성공 메시지 또는 알림 표시
        }
        function onError(error) {
            console.error("Error occurred:", error);
            alert("Failed to create node. Please try again.");
        }

    // 노드를 화면에 추가하는 함수
    function addNodeToList(node) {
        return new Promise((resolve, reject) => {
            // 노드 엘리먼트 생성 및 스타일 설정
            const nodeElement = document.createElement('div');
            nodeElement.id = `node-${node.id}`; // 각 노드에 고유 ID 추가
            nodeElement.className = 'node-box'; // CSS 스타일 적용을 위한 클래스



            if(node.x == 0 && node.y == 0){
                const rect = nodeForm.getBoundingClientRect();
                nodeElement.style.left = `${rect.x + rect.width + 60}px`; // 초기 x 좌표 설정
                nodeElement.style.top = `${rect.y + (rect.height / 2)}px`; // 초기 y 좌표 설정
            }else{
                nodeElement.style.left = `${node.x}px`; // 기존 x 좌표 설정
                nodeElement.style.top = `${node.y}px`; // 기존 y 좌표 설정
            }

            // 노드 내용 추가
            nodeElement.innerHTML = `
            <div class="btn-wrap-close" onclick="deleteNode(${node.id})">
                <button type="button" class="btn-close" aria-label="Close"></button>
            </div>
            <button type="button" onclick="insertContentsOnModal(${node.id}, '${encodeURIComponent(node.imageURL.replace(/['"]+/g, ''))}', '${node.prompt}')" class="btn btn-primary btnImgExpand" data-bs-toggle="modal" data-bs-target="#ImgExpandModal">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-arrows-fullscreen" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M5.828 10.172a.5.5 0 0 0-.707 0l-4.096 4.096V11.5a.5.5 0 0 0-1 0v3.975a.5.5 0 0 0 .5.5H4.5a.5.5 0 0 0 0-1H1.732l4.096-4.096a.5.5 0 0 0 0-.707m4.344 0a.5.5 0 0 1 .707 0l4.096 4.096V11.5a.5.5 0 1 1 1 0v3.975a.5.5 0 0 1-.5.5H11.5a.5.5 0 0 1 0-1h2.768l-4.096-4.096a.5.5 0 0 1 0-.707m0-4.344a.5.5 0 0 0 .707 0l4.096-4.096V4.5a.5.5 0 1 0 1 0V.525a.5.5 0 0 0-.5-.5H11.5a.5.5 0 0 0 0 1h2.768l-4.096 4.096a.5.5 0 0 0 0 .707m-4.344 0a.5.5 0 0 1-.707 0L1.025 1.732V4.5a.5.5 0 0 1-1 0V.525a.5.5 0 0 1 .5-.5H4.5a.5.5 0 0 1 0 1H1.732l4.096 4.096a.5.5 0 0 1 0 .707"/>
                </svg>
            </button>
            <div class="node-func">
                <div class="info"><p>Prompt:</p><div class="prompt">${node.prompt}</div></div>
                <div class="action">
                    <a href="" download target="_self" role="button">
                        <button type="button" class="btn btn-secondary">Download</button>
                    </a>
                    <button onclick="Img2ImgAddNode(${node.id})" type="button" class="btn img2img btn-primary">Img2Img</button>
                </div>
            </div>`;

            // 이미지 URL이 있으면 이미지 태그 추가
            if (node.imageURL) {
                const imageElement = document.createElement('img');
                const cleanImageURL = node.imageURL.replace(/['"]+/g, ''); // URL에서 따옴표 제거
                imageElement.src = cleanImageURL; // 수정된 URL 사용
                imageElement.alt = node.prompt;
                imageElement.style.width = '100%'; // 이미지 너비 설정
                imageElement.style.height = 'auto'; // 높이는 자동으로 설정
                nodeElement.appendChild(imageElement); // 노드 박스에 이미지 추가
            }
            

            // 노드 드래그 가능하도록 설정
            makeNodeDraggable(nodeElement, node.id);

            // 노드를 리스트에 추가
            nodesList.appendChild(nodeElement);

            // 재귀적으로 자식 노드 처리
            if (node.children && node.children.length > 0) {
                // 자식 노드가 있을 경우 모든 자식 노드의 addNodeToList 완료 시 resolve
                Promise.all(node.children.map(child => addNodeToList(child)))
                    .then(() => resolve())  // 자식들이 모두 처리되었을 때 resolve 호출
                    .catch(err => reject(err));  // 에러 발생 시 reject
            } else {
                // 자식 노드가 없으면 바로 resolve
                resolve();
            }
        });

        console.log('Worked???');
    }

    function GenImg2Img(target, parentId){

        let seed = target.parentElement.parentElement.querySelector('.form-check-input').checked;
        if(seed == "on"){
            seed = true;
        }else{
            seed = false;
        }


        console.log("GenImg2Img", target, parentId, seed, typeof seed);
        
        const projectId = CurrentProjectId;
        const parentNodeId = parentId;
        const currentNode = target.parentElement.parentElement.parentElement;
        
        const additionalPrompt = currentNode.querySelector('textarea').value;
        const parentsPrompt = currentNode.querySelector('input').value;
        const prompt = parentsPrompt + ', ' + additionalPrompt;
        //console.log(currentNode)


        target.parentElement.parentElement.classList.add('hide');
        target.parentElement.parentElement.parentElement.getElementsByClassName('loading')[0].classList.remove('hide');


        // 현재 노드 위치
        const x = parseInt(currentNode.style.left, 10);
        const y = parseInt(currentNode.style.top, 10);

        const nodeData = {
            prompt: prompt,
            x: x, // X 좌표 추가
            y: y,  // Y 좌표 추가
            parentNodeId: parentNodeId,
            projectId: projectId,
            seed: seed
        };
        console.log(currentNode, nodeData)

        // 서버로 노드 생성 요청
        fetch('/node', {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "access": `${localStorage.getItem('access')}` // Access Token 추가
            },
            body: JSON.stringify(nodeData)
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                console.log("Node created:", data);
                // addNodeToList(data); // 새로 생성된 노드를 화면에 추가
                
                // currentNode.remove();
                deleteFinishedNode(currentNode, parentNodeId);
                upadteNodeCheck();
            })
            .catch(error => {
                console.error("Error creating node:", error);
            });
    }


    function deleteEmptyNode(target, parentId){
        target.parentElement.remove();
        const childPathes = document.getElementsByClassName('childPathOf-' + parentId);
        for (let i = 0; i < childPathes.length; i++) {
            childPathes[i].remove();
        }
    }
    function deleteFinishedNode(target, parentId){
        target.remove();
        const childPathes = document.getElementsByClassName('childPathOf-' + parentId);
        for (let i = 0; i < childPathes.length; i++) {
            childPathes[i].remove();
        }
    }


    // 노드 지우기 함수
    const locallyDeletedNodes = new Set();

    function deleteNode(nodeID) {
        console.log("deleteNode");

        // document.getElementById('node-' + nodeID).remove();
        // document.getElementById(`line-${nodeID}`)?.remove();
        
        // DELETE API 호출
        fetch(`/project/${CurrentProjectId}/node/${nodeID}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
                "access": `${localStorage.getItem('access')}` // Access Token 추가
            }
        })
            .then(response => {
                if (response.ok) {

                    locallyDeletedNodes.add(nodeID);
                    document.getElementById(`node-${nodeID}`)?.remove();
                    document.getElementById(`path-${nodeID}`)?.remove();
                    upadteNodeCheck();
                    console.log("Node deleted successfully.");
                    
                } else {
                    return response.json().then(err => {
                        console.error("Failed to delete node:", err.message);
                    });
                }
            })
            .catch(error => {
                console.error("Error deleting node:", error);
            });
    }
